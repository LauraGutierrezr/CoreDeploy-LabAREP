<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="system-ui, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#f8fafc"/>

  <!-- Browser -->
  <rect x="30" y="40" width="220" height="120" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="65" text-anchor="middle" font-weight="700" font-size="15" fill="#0c4a6e">Browser</text>
  <text x="140" y="88" text-anchor="middle" font-size="12" fill="#0c4a6e">index.html / app.js</text>
  <text x="140" y="105" text-anchor="middle" font-size="12" fill="#0c4a6e">fetch("/hello?name=..")</text>
  <text x="140" y="122" text-anchor="middle" font-size="12" fill="#0c4a6e">fetch("/pi")</text>
  <text x="140" y="140" text-anchor="middle" font-size="11" fill="#0369a1">no page reload</text>

  <!-- Internet -->
  <rect x="300" y="70" width="130" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="365" y="105" text-anchor="middle" font-weight="700" font-size="13" fill="#713f12">Internet</text>

  <!-- AWS boundary -->
  <rect x="470" y="30" width="500" height="500" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="490" y="55" font-weight="700" font-size="14" fill="#334155">AWS · EC2 instance</text>

  <!-- Security group -->
  <rect x="490" y="70" width="460" height="440" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="510" y="93" font-weight="700" font-size="13" fill="#334155">Security group (firewall)</text>
  <text x="510" y="110" font-size="11" fill="#475569">Inbound: 22/tcp from admin IP only</text>
  <text x="510" y="125" font-size="11" fill="#475569">Inbound: 8081/tcp (app port) from allowed clients</text>

  <!-- HttpServer -->
  <rect x="515" y="145" width="410" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="720" y="168" text-anchor="middle" font-weight="700" font-size="14" fill="#14532d">HttpServer (sequential)</text>
  <text x="720" y="188" text-anchor="middle" font-size="11" fill="#14532d">One ServerSocket, one accept() at a time</text>
  <text x="720" y="205" text-anchor="middle" font-size="10" fill="#166534">systemd service · restarts on failure · survives logout</text>

  <!-- Router -->
  <rect x="515" y="245" width="195" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="612" y="268" text-anchor="middle" font-weight="700" font-size="13" fill="#1e3a8a">Router</text>
  <text x="612" y="288" text-anchor="middle" font-size="11" fill="#1e3a8a">GET /hello -&gt; lambda</text>
  <text x="612" y="304" text-anchor="middle" font-size="11" fill="#1e3a8a">GET /pi -&gt; lambda</text>
  <text x="612" y="320" text-anchor="middle" font-size="11" fill="#1e3a8a">GET /shutdown -&gt; lambda</text>
  <text x="612" y="340" text-anchor="middle" font-size="10" fill="#1d4ed8">(disabled when APP_ENV=production)</text>

  <!-- StaticFileService -->
  <rect x="730" y="245" width="195" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="827" y="268" text-anchor="middle" font-weight="700" font-size="13" fill="#4c1d95">StaticFileService</text>
  <text x="827" y="288" text-anchor="middle" font-size="11" fill="#4c1d95">index.html, styles.css</text>
  <text x="827" y="304" text-anchor="middle" font-size="11" fill="#4c1d95">app.js, images/logo.png</text>
  <text x="827" y="322" text-anchor="middle" font-size="10" fill="#5b21b6">classpath (jar) or</text>
  <text x="827" y="337" text-anchor="middle" font-size="10" fill="#5b21b6">STATIC_FILES_PATH override</text>

  <!-- Application layer -->
  <rect x="515" y="380" width="410" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="720" y="403" text-anchor="middle" font-weight="700" font-size="13" fill="#7f1d1d">Application (co.edu.escuelaing.app)</text>
  <text x="720" y="423" text-anchor="middle" font-size="11" fill="#7f1d1d">registers routes with WebFramework.get(...)</text>
  <text x="720" y="440" text-anchor="middle" font-size="11" fill="#7f1d1d">GREETING_PREFIX / PORT / APP_ENV from env vars</text>
  <text x="720" y="457" text-anchor="middle" font-size="10" fill="#991b1b">only class that knows about "hello" and "pi"</text>

  <!-- Arrows -->
  <line x1="250" y1="100" x2="298" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="100" x2="513" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="513" y1="160" x2="430" y2="115" stroke="#334155" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <line x1="650" y1="225" x2="612" y2="243" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="790" y1="225" x2="827" y2="243" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="720" y="238" text-anchor="middle" font-size="10" fill="#475569">route matched? / else try static file / else 404</text>

  <line x1="612" y1="355" x2="680" y2="378" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="640" y="372" text-anchor="middle" font-size="9" fill="#475569">registers</text>

  <text x="720" y="530" text-anchor="middle" font-size="12" fill="#475569">
    Application code only calls WebFramework.get()/staticfiles()/start(); it never touches sockets, routing or file I/O directly.
  </text>
</svg>
